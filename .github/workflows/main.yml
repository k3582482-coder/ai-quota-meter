name: Build AI Quota Meter APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk AI-Quota-Meter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Quota-Meter-APK
          path: AI-Quota-Meter.apk

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" AI-Quota-Meter.apk \
            --title "AI 額度錶 $TAG" \
            --notes "直接點擊下方 AI-Quota-Meter.apk 下載至 Android 手機安裝，安裝後長按桌面即可新增 2x2 AI 額度錶小工具。"
